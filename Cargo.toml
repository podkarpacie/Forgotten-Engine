[workspace]
resolver = "2"
members = [
  "crates/forgotten-core",
  "crates/forgotten-persistence",
  "crates/forgotten-protocol",
  "crates/forgotten-scripting",
  "crates/forgotten-config",
  "crates/forgotten-host",
  "crates/forgotten-engine-cli",
  "crates/forgotten-harness",
]

[workspace.package]
version = "7.4.48"
edition = "2021"
# Real floor, not an aspiration: zeroize 1.9.0 (transitive, via the RSA/crypto
# chain) declares edition 2024 and rust-version 1.85, so the previous 1.75 claim
# was simply false and blocked contributors on a 1.75 toolchain.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/podkarpacie/Forgotten-Engine"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
